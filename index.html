<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

</head>
<body>
    <div class="container">
        <h1>Country Music Player</h1>
        <div class="player-container">
            <div class="player-controls" aria-label="Music controls">
                <button id="playPauseBtn" class="control-btn" type="button" aria-label="Play or pause">▶ / ‖</button>
                <button id="prevBtn" class="control-btn" type="button" aria-label="Previous">⏮</button>
                <button id="nextBtn" class="control-btn" type="button" aria-label="Next">⏭</button>
                <button id="fullscreenBtn" class="control-btn" type="button" aria-label="Fullscreen">⛶</button>
                <button id="add-media" class="control-btn" type="button">Add Media</button>
            </div>
                <div id="song-list-items" class="song-list-items">
                    <!-- Songs will be dynamically added here -->
                </div>
            </div>
            <div class="media-container">
                <video id="mediaPlayer" class="media-player" controls>
                    <source id="mediaSource" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="media-controls">
                    <button id="previous-btn" class="control-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 18l-6-6 6-6"/>
                            <path d="M6 18l6-6-6-6"/>
                        </svg>
                    </button>
                    <button id="play-btn" class="control-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 3l14 9-14 9V3z"/>
                        </svg>
                    </button>
                    <button id="pause-btn" class="control-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="3" width="4" height="18" rx="1" ry="1"/>
                            <rect x="14" y="3" width="4" height="18" rx="1" ry="1"/>
                        </svg>
                    </button>
                    <button id="volume-btn" class="control-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l6.5 6.5a8 8 0 1 0 10.937-10.937L3 3v6z"/>
                        </svg>
                    </button>
                    <button id="fullscreen-btn" class="control-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m2 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                    </button>
                    <button id="next-btn" class="control-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12l-7-7-7 7 7 7 7-7z"/>
                        </svg>
                    </button>
                </div>
                <!-- Volume control -->
                <div id="volume-control" class="volume-control">
                    <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
                </div>
                <div class="status">
                    <p id="status-text">Offline Mode: Working Perfectly</p>
                    <div id="offline-indicator" class="offline-indicator"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
      'use strict';
      const mediaPlayer = document.getElementById('mediaPlayer');
      const songListItems = document.getElementById('song-list-items');
      const statusText = document.getElementById('status-text');
      const offlineIndicator = document.getElementById('offline-indicator');
      const volumeSlider = document.getElementById('volume-slider');
      const audioLibrary = [];
      const activeObjectURLs = new Set();
      let currentSongIndex = -1;
      let mediaDatabase = null;

      function updateStatus(message) {
        statusText.textContent = message || (navigator.onLine
          ? 'Online · Imported media is stored locally when space allows'
          : 'Offline · Saved media remains available on this device');
        offlineIndicator.style.display = navigator.onLine ? 'none' : 'block';
      }

      function renderSongList() {
        songListItems.replaceChildren();
        if (audioLibrary.length === 0) {
          const empty = document.createElement('p');
          empty.textContent = 'No local media added yet. Select Add Media to import audio or video files.';
          songListItems.append(empty);
          return;
        }
        for (const [index, song] of audioLibrary.entries()) {
          const row = document.createElement('div');
          row.className = 'song-item';
          const label = document.createElement('span');
          label.textContent = song.name;
          const button = document.createElement('button');
          button.className = 'play-song';
          button.type = 'button';
          button.textContent = index === currentSongIndex ? 'Playing' : 'Play';
          button.addEventListener('click', () => playSong(index));
          row.append(label, button);
          songListItems.append(row);
        }
      }

      async function playSong(index) {
        if (!audioLibrary.length || index < 0 || index >= audioLibrary.length) return;
        currentSongIndex = index;
        mediaPlayer.src = audioLibrary[index].src;
        mediaPlayer.load();
        renderSongList();
        try {
          await mediaPlayer.play();
          updateStatus();
        } catch (error) {
          updateStatus('Playback unavailable for this media: ' + (error?.message || 'unsupported format'));
        }
      }

      function advanceSong(direction) {
        if (!audioLibrary.length) return;
        const next = (Math.max(0, currentSongIndex) + direction + audioLibrary.length) % audioLibrary.length;
        playSong(next);
      }

      function togglePlay() {
        if (!audioLibrary.length) { updateStatus('Add a local audio or video file first.'); return; }
        if (mediaPlayer.paused) {
          if (currentSongIndex < 0) playSong(0);
          else mediaPlayer.play().catch(() => updateStatus('Playback was blocked by the browser.'));
        } else mediaPlayer.pause();
      }

      async function openMediaDb() {
        if (!('indexedDB' in window)) return null;
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('offline-music-media', 1);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains('files')) {
              request.result.createObjectStore('files', { keyPath: 'id' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function listStoredFiles(db) {
        return new Promise((resolve, reject) => {
          const request = db.transaction('files', 'readonly').objectStore('files').getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      function saveStoredFile(db, record) {
        return new Promise((resolve, reject) => {
          const request = db.transaction('files', 'readwrite').objectStore('files').put(record);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      function addToLibrary(record) {
        if (!record?.blob || !record?.name) return;
        const src = URL.createObjectURL(record.blob);
        activeObjectURLs.add(src);
        audioLibrary.push({ id: record.id, name: record.name, src });
        renderSongList();
      }

      async function initializeLibrary() {
        try {
          mediaDatabase = await openMediaDb();
          if (mediaDatabase) {
            const records = await listStoredFiles(mediaDatabase);
            records.forEach(addToLibrary);
          }
        } catch (error) {
          mediaDatabase = null;
          updateStatus('Persistent storage unavailable; imported files will work until this tab closes.');
        }
      }

      document.getElementById('add-media').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'audio/*,video/*';
        input.multiple = true;
        input.addEventListener('change', async () => {
          for (const file of input.files || []) {
            const record = {
              id: (crypto.randomUUID?.() || (Date.now() + '-' + Math.random())),
              name: file.name,
              blob: file,
            };
            addToLibrary(record);
            if (mediaDatabase) {
              try {
                await saveStoredFile(mediaDatabase, record);
              } catch (error) {
                updateStatus('Media added for this session; storage quota or permissions prevented saving it.');
              }
            }
          }
        });
        input.click();
      });

      const onClick = (ids, handler) => ids.forEach(id => {
        const button = document.getElementById(id);
        if (button) button.addEventListener('click', handler);
      });
      onClick(['playPauseBtn', 'play-btn'], togglePlay);
      onClick(['pause-btn'], () => mediaPlayer.pause());
      onClick(['prevBtn', 'previous-btn'], () => advanceSong(-1));
      onClick(['nextBtn', 'next-btn'], () => advanceSong(1));
      onClick(['fullscreenBtn', 'fullscreen-btn'], () => {
        if (!document.fullscreenElement) mediaPlayer.requestFullscreen?.().catch(() => {});
        else document.exitFullscreen?.().catch(() => {});
      });
      onClick(['volume-btn'], () => {
        mediaPlayer.muted = !mediaPlayer.muted;
        document.getElementById('volume-btn').setAttribute('aria-pressed', String(mediaPlayer.muted));
      });
      volumeSlider.value = '100';
      volumeSlider.addEventListener('input', () => { mediaPlayer.volume = Number(volumeSlider.value) / 100; });
      mediaPlayer.addEventListener('ended', () => advanceSong(1));
      window.addEventListener('online', () => updateStatus());
      window.addEventListener('offline', () => updateStatus());
      window.addEventListener('beforeunload', () => {
        activeObjectURLs.forEach(src => URL.revokeObjectURL(src));
        mediaDatabase?.close();
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' })
            .catch(error => updateStatus('Offline app caching unavailable: ' + error.message));
        });
      }
      updateStatus();
      initializeLibrary();
    </script>
</body>
</html>
